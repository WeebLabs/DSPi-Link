# Release of the ESP32 bridge (bridge spec 15). Pushing a tag named
# bridge-v<version>, where <version> is PROJECT_VER in
# bridge/esp32/CMakeLists.txt, builds every chip, attaches the firmware to a
# GitHub release, and publishes the installer page to GitHub Pages.
#
#   git tag bridge-v1.0.0 && git push origin bridge-v1.0.0
#
# Two repository settings are needed, once:
#
# - Settings, Pages, Source: GitHub Actions.
# - Settings, Environments, github-pages, Deployment branches and tags: add
#   a tag rule `bridge-v*`. GitHub creates the environment allowing only the
#   default branch, and it refuses a deployment from a release tag otherwise
#   ("Tag ... is not allowed to deploy to github-pages").
#
# Actions are pinned by commit, with the release in a comment; update both
# together.
name: ESP32 bridge release

on:
  push:
    tags:
      - "bridge-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run third-party code (npm packages, PyPI, the
          # ESP-IDF image); none of them needs the token in .git/config.
          persist-credentials: false

      - name: Check the tag matches the firmware version
        run: |
          version=$(sed -n -E 's/^set\(PROJECT_VER "([^"]+)"\)$/\1/p' bridge/esp32/CMakeLists.txt)
          if [ "${GITHUB_REF_NAME}" != "bridge-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match PROJECT_VER ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      # The same checks as every push (esp32-bridge.yml), so a tag can never
      # publish firmware that fails them.
      - name: Check formatting
        working-directory: bridge/esp32
        run: |
          pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror \
            $(find components main test -name '*.[ch]' ! -name link_policy_table.c)
      - name: Check the generated policy table is up to date
        working-directory: bridge/esp32
        run: python3 tools/gen_policy.py --check
      - name: Build and run host tests
        working-directory: bridge/esp32
        run: |
          cmake -S test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the web pages the firmware embeds
        working-directory: js
        run: npm ci && npm run build

      - name: Build every chip
        run: bridge/esp32/tools/build.sh

      - name: Package the release and the installer site
        run: bridge/esp32/tools/package_release.sh

      - name: Boot each full image in QEMU
        # QEMU has no ESP32-C6 machine, so that chip is build-only here.
        run: |
          cd bridge/esp32
          for chip in esp32 esp32s3 esp32c3; do
            tools/qemu_smoke.sh "${chip}" "build/release/dspi-bridge-${VERSION}-${chip}.bin"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Firmware for the DSPi Link ESP32 bridge, version ${VERSION}.

          - To install on a new board, use the installer page, or flash
            \`dspi-bridge-${VERSION}-<chip>.bin\` at address 0x0 with esptool.
          - To update a bridge that is already running, choose
            \`dspi-bridge-${VERSION}-<chip>-update.bin\` under Bridge settings,
            Maintenance, Update firmware.

          \`SHA256SUMS\` lists every file's SHA-256.
          NOTES
          gh release create "${GITHUB_REF_NAME}" bridge/esp32/build/release/* \
            --title "ESP32 bridge ${VERSION}" --notes-file notes.md

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: bridge/esp32/build/site

  installer:
    needs: release
    runs-on: ubuntu-latest
    # One Pages deployment at a time; a second release waits rather than
    # cancelling the first.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}installer/
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
