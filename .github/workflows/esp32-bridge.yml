# CI for the ESP32 bridge (bridge spec 17): formatting, host tests, and a
# firmware build for every supported chip with the image-size budget.
# Actions are pinned by commit, with the release in a comment; update both
# together.
name: ESP32 bridge

on:
  push:
    paths:
      - "bridge/esp32/**"
      - "policy/**"
      - "fixtures/**"
      - "js/**"
      - ".github/workflows/esp32-bridge.yml"
  pull_request:
    paths:
      - "bridge/esp32/**"
      - "policy/**"
      - "fixtures/**"
      - "js/**"
      - ".github/workflows/esp32-bridge.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/esp32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run third-party code (npm packages, PyPI, the
          # ESP-IDF image); none of them needs the token in .git/config.
          persist-credentials: false
      - name: Check formatting
        # pipx is on every GitHub runner and keeps the pinned clang-format
        # out of the system Python, which Ubuntu 24.04 protects (PEP 668).
        run: |
          pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror \
            $(find components main test -name '*.[ch]' ! -name link_policy_table.c)
      - name: Check the generated policy table is up to date
        run: python3 tools/gen_policy.py --check

  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/esp32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build and run host tests
        run: |
          cmake -S test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32s3, esp32c3, esp32c6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the web pages the firmware embeds
        working-directory: js
        run: npm ci && npm run build
      - name: Build for ${{ matrix.chip }}
        run: bridge/esp32/tools/build.sh ${{ matrix.chip }}
      - name: Boot twice in QEMU
        # QEMU has no ESP32-C6 machine, so that chip is build-only here.
        if: matrix.chip != 'esp32c6'
        run: bridge/esp32/tools/qemu_smoke.sh ${{ matrix.chip }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dspi-bridge-${{ matrix.chip }}
          path: |
            bridge/esp32/build/${{ matrix.chip }}/dspi_bridge.bin
            bridge/esp32/build/${{ matrix.chip }}/bootloader/bootloader.bin
            bridge/esp32/build/${{ matrix.chip }}/partition_table/partition-table.bin
            bridge/esp32/build/${{ matrix.chip }}/flash_args
